[workspace]
resolver = "2"
members = ["crates/protocol", "crates/macos-host", "crates/cg-virtual-display", "crates/android-client"]

# Release profile — tuned for SPEED (development, benchmarking, latency work).
#
# RustScreen is a latency-critical app (glass-to-glass second-monitor mirroring),
# so the default release build optimizes for raw performance, NOT binary size.
# Use `--profile dist` (below) to produce the small, stripped artifact that ships.
#
#   opt-level = 3      — maximum scalar/codegen optimization for lowest latency.
#   lto = "thin"       — cross-crate inlining with much faster link times than full
#                        LTO, so the dev/benchmark release loop stays usable.
#   codegen-units = 1  — best within-crate optimization (slower compile, faster code).
#   strip = false      — keep symbols so release builds are profilable out of the box.
#
# `panic` is intentionally left at the default `unwind`. It is a whole-build
# profile knob that Cargo cannot override per package, and `android-client`
# relies on `std::panic::catch_unwind` at its `extern "system"` JNI boundary
# (BL-03) to turn a panic into a graceful error instead of aborting the host
# Android process. Forcing `panic = "abort"` here would silently defeat that
# guard. An `unwind` panic in the macOS host still prints and exits non-zero, so
# a fatal bug is still surfaced.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false

# Distribution profile — tuned for SIZE (the shipped, notarized `.app`/DMG and
# the Android `.so`). Inherits everything from `release` and overrides only the
# size knobs. The packaging scripts (packaging/macos/make_app.sh,
# packaging/android/build_release_apk.sh) and the CI `package-macos` job build
# the shipped artifact with `cargo build --profile dist`.
#
#   opt-level = "z"  — optimize for size; the host is latency-bound on the GPU/USB
#                      path, not scalar CPU work, so a smaller shipped binary is a
#                      worthwhile trade for the artifact users download.
#   lto = true       — full cross-crate LTO; smallest binaries (slower to link, but
#                      this profile is only built for releases, not the dev loop).
#   strip = true     — drop symbols from the shipped binary (debuginfo not shipped).
#
# `panic` is inherited as `unwind` from `release` (see the BL-03 note above).
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
strip = true

# Shared package metadata consumed by the packaging scripts (packaging/) so the
# app name / bundle id / version live in ONE place. Plain TOML the scripts read;
# Cargo itself ignores [workspace.metadata.*].
[workspace.metadata.rustscreen]
app-name = "RustScreen"
bundle-id = "com.rustscreen.host"
# Keep in sync with crates/macos-host/Cargo.toml `version` and
# android/app/build.gradle.kts `versionName`.
version = "0.1.0"
# Apple Developer "Developer ID Application" identity + notarization profile are
# NOT hard-coded here — they are supplied at package time via env vars so no
# secrets land in the repo. See packaging/macos/README.md.
