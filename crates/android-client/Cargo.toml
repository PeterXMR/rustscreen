[package]
name = "android-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# P4 Wave B (DEC-01): the `ndk-sys` `AMediaCodec` decode-to-surface adapter + the
# `nativeOnSurface` JNI entry. Gated so the *default* `cargo build --workspace` pulls no
# `ndk`/`ndk-sys`, exactly like `macos-host`'s `live-usb`/`live-inject`. The Wave-A
# host-tested `decode` port/session is always built (no feature needed). Enable with
# `cargo ndk -t arm64-v8a build -p android-client --features live-decode`.
live-decode = ["dep:ndk-sys", "dep:android-activity", "dep:ndk"]

[dependencies]
# Shared length-framing codec — reused verbatim by echo_loop (host-testable, not
# cfg-gated) so the phone and the macOS host stay wire-compatible.
protocol = { path = "../protocol" }
# `log` is the platform-agnostic logging facade — needed by the non-cfg-gated echo_loop
# (a silent no-op on the host without a logger; captured by android_logger on device).
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"
# `ndk-sys` is the thin FFI the Wave-B `AMediaCodec` decode-to-surface adapter binds
# against; optional + only pulled in by the `live-decode` feature so the default build
# stays dependency-free (the Wave-A port/session need none of it).
ndk-sys = { version = "0.6", optional = true }
# NativeActivity entry point + event loop (surface/lifecycle). The native-activity backend
# pulls NO AndroidX (unlike the GameActivity backend), preserving the app's zero-AndroidX
# profile. Optional + only via `live-decode`, exactly like ndk-sys, so the default host
# workspace build stays dependency-free.
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
# High-level `ndk` wrapper — used only to read the raw `ANativeWindow` pointer out of
# android-activity's `AndroidApp::native_window()`. Same ndk-sys 0.6 ABI as above.
ndk = { version = "0.9", optional = true }
