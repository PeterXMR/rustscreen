version: 2
updates:
  # Cargo dependencies (Rust)
  # directory "/" points at the workspace root, which covers the root manifest
  # and all member crates (protocol, macos-host, cg-virtual-display,
  # android-client) in a single ecosystem entry.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      cargo-deps:
        patterns:
          - "*"
        exclude-patterns: []
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "cargo"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
