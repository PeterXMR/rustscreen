name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (build / test / clippy / fmt)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The jobs above build feature-free, which SKIPS every `required-features`-gated live host
      # binary (p5_stream, rustscreen, p3_*, p6_inject) and the whole `serve`/`session` live
      # pipeline — the latency-critical code. Compile + clippy it here so a type error or lint
      # failure in the live host path can't merge green. (It only COMPILES in CI; running it needs
      # Mac screen-recording permission + the Pixel, so there is no `cargo test` with these features.)
      - name: cargo clippy -p macos-host (live features)
        run: cargo clippy -p macos-host --all-targets --features live-capture,live-usb,live-inject -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  android-native:
    name: Android native (.so via cargo-ndk)
    runs-on: macos-latest
    # NOTE: The Gradle APK build (assembleDebug) is intentionally NOT included here.
    # It requires a pinned JDK (17–21) and a fully-installed Android SDK/emulator — that
    # setup will be added in a later phase (P7/P8) once the build is stable.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up Android NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build android-client .so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        # `--features live-decode` is REQUIRED for the shipped/device .so: it compiles the
        # `AMediaCodec` adapter *and* the `nativeOnSurface`/`nativeOnSurfaceDestroyed` JNI
        # entries that the Kotlin `SurfaceHolder.Callback` calls unconditionally. Without it
        # those symbols are absent and the app crashes on launch with `UnsatisfiedLinkError`.
        # (The host `cargo build --workspace` job above stays feature-free / dependency-free.)
        run: >
          cargo ndk
          -t arm64-v8a
          -o android/app/src/main/jniLibs
          build -p android-client --features live-decode

  # P8 packaging smoke: build the release host binary and assemble the UNSIGNED .app
  # bundle so the packaging path stays buildable. Additive and non-gating — it does
  # not run live-* features (no Mac permissions / hardware in CI) and does not sign or
  # notarize (no secrets in CI). It only proves make_app.sh produces a bundle.
  package-macos:
    name: Package (unsigned .app smoke)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Prove the SHIPPED profile (`dist`: opt-level=z + full LTO) of the real featured host binary
      # builds — full LTO can surface codegen/link errors thin-LTO `release` does not, and
      # make_app.sh builds `--profile dist` with no features (only the stub `macos-host` bin).
      - name: cargo build --profile dist (live host binary)
        run: cargo build --profile dist -p macos-host --bin rustscreen --features live-capture,live-usb

      - name: Assemble unsigned RustScreen.app (release)
        run: packaging/macos/make_app.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustScreen-app-unsigned
          path: dist/RustScreen.app
          if-no-files-found: error
